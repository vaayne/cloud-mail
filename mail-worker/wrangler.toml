name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail"
database_id = "0b09b688-dc4a-4b66-93ae-58c63eb253bc"

[[kv_namespaces]]
binding = "kv"
id = "f85153409c4f442db2e96369fb25fdb4"

[[r2_buckets]]
binding = "r2"
bucket_name = "cloud-mail"

#[[send_email]]
#name = "email"			#CF发件, 配置后优先使用

[ai]
binding = "ai"

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]	#每小时执行；resetDaySendCount 仅在 UTC 0 点生效


[vars]
domain = ["vaayne.com", "tokenflux.ai", "recally.io"]
admin = "v@vaayne.com"
#ai_model = ""			#ai模型,不填默认使用@cf/meta/llama-3.1-8b-instruct-fast
#analysis_cache = false			#是否开启分析数据缓存
#orm_log = false			#是否sql日志

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
